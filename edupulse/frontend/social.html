<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mạng Xã Hội - EduPulse</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06040d">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',950:'#06040d'}}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/shared.css">
</head>
<body class="bg-brand-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden">
<div id="toast-notif-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
<div class="flex h-screen relative z-10 overflow-hidden">
  <aside id="sidebar-slot"></aside>
  <main class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6">
    <header class="flex items-center justify-between mb-6 glass-panel p-4 rounded-3xl shadow-xl">
      <div class="flex items-center gap-4">
        <button class="lg:hidden p-3 rounded-2xl bg-white/5" onclick="document.getElementById('mobile-drawer').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>
        <h2 class="text-xl lg:text-2xl font-black"><i class="fa-solid fa-comments text-pink-400 mr-2"></i>Mạng Xã Hội EduPulse</h2>
      </div>
      <button onclick="toggleChat()" class="btn-primary text-xs"><i class="fa-solid fa-message mr-1"></i>Trò Chuyện</button>
    </header>
    <div id="mobile-drawer" class="hidden lg:hidden glass-panel rounded-3xl mb-4"><div id="mobile-nav-slot"></div></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        <div class="glass-panel p-4 rounded-3xl">
          <textarea id="post-content" class="input-field" rows="3" placeholder="Bạn đang nghĩ gì?"></textarea>
          <div class="flex items-center justify-between mt-3">
            <input type="file" id="post-image" accept="image/*" class="text-xs">
            <button onclick="createPost()" class="btn-primary text-xs"><i class="fa-solid fa-paper-plane mr-1"></i>Đăng</button>
          </div>
        </div>
        <div id="feed"></div>
      </div>

      <div class="glass-panel p-4 rounded-3xl h-fit">
        <h3 class="text-xs font-black text-slate-400 uppercase mb-3">Mọi người</h3>
        <div id="people-list" class="space-y-2"></div>
      </div>
    </div>
  </main>
</div>

<!-- Chat panel -->
<div id="chat-panel" class="fixed bottom-4 right-4 w-80 h-[420px] glass-panel rounded-3xl shadow-2xl flex-col hidden z-[1500]">
  <div class="p-3 border-b border-white/10 flex items-center justify-between">
    <span id="chat-title" class="font-black text-sm">Trò chuyện</span>
    <button onclick="toggleChat()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="chat-messages" class="flex-1 overflow-y-auto p-3 space-y-2 text-xs"></div>
  <div class="p-3 border-t border-white/10 flex gap-2">
    <input id="chat-input" class="input-field text-xs" placeholder="Nhập tin nhắn...">
    <button onclick="sendChat()" class="btn-primary text-xs px-3"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  let people = [], activePartner = null, ws = null;
  if (EduLayout.guard('social')) { loadFeed(); loadPeople(); connectChat(); }

  function avatarHtml(u, size = 9) {
    const initials = (u.fullName || u.username || '?').trim().split(/\s+/).slice(-2).map(s => s[0]).join('').toUpperCase();
    return u.avatar ? `<img src="${EduAPI.fileUrl(u.avatar)}" class="w-${size} h-${size} rounded-full object-cover">` : `<div class="avatar-initial w-${size} h-${size} text-xs">${initials}</div>`;
  }

  async function loadFeed() {
    const { posts } = await EduAPI.request('/api/posts');
    const me = EduAPI.getUser();
    document.getElementById('feed').innerHTML = posts.map(p => `
      <div class="glass-panel p-4 rounded-3xl mb-4">
        <div class="flex items-center gap-3 mb-2">
          ${p.author ? avatarHtml(p.author) : ''}
          <div>
            <p class="font-bold text-sm">${p.author ? (p.author.fullName || p.author.username) : 'Ẩn danh'}</p>
            <p class="text-[10px] text-slate-500">${new Date(p.createdAt).toLocaleString('vi-VN')}</p>
          </div>
          ${(p.author && p.author.id === me.id) || me.role === 'admin' ? `<button onclick="deletePost('${p.id}')" class="ml-auto text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div>
        <p class="text-sm mb-2 whitespace-pre-wrap">${escapeHtml(p.content)}</p>
        ${p.image ? `<img src="${EduAPI.fileUrl(p.image)}" class="rounded-2xl max-h-96 w-full object-cover mb-2">` : ''}
        <div class="flex items-center gap-4 text-xs text-slate-400 border-t border-white/5 pt-2">
          <button onclick="likePost('${p.id}')" class="hover:text-pink-400"><i class="fa-solid fa-heart mr-1"></i>${p.likeCount} Thích</button>
          <span><i class="fa-solid fa-comment mr-1"></i>${p.commentCount} Bình luận</span>
        </div>
        <div class="mt-2 space-y-1">
          ${p.comments.slice(-3).map(c => `<p class="text-xs text-slate-300"><b>${c.authorId === me.id ? 'Bạn' : 'User'}:</b> ${escapeHtml(c.content)}</p>`).join('')}
        </div>
        <div class="flex gap-2 mt-2">
          <input class="input-field text-xs" placeholder="Viết bình luận..." onkeydown="if(event.key==='Enter')commentPost('${p.id}', this)">
        </div>
      </div>`).join('') || '<p class="text-slate-500 text-sm">Chưa có bài viết nào. Hãy là người đầu tiên chia sẻ!</p>';
  }

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  async function createPost() {
    const content = document.getElementById('post-content').value.trim();
    const file = document.getElementById('post-image').files[0];
    if (!content && !file) return;
    const fd = new FormData();
    fd.append('content', content);
    if (file) fd.append('image', file);
    try {
      await EduAPI.request('/api/posts', { method: 'POST', body: fd, isForm: true });
      document.getElementById('post-content').value = '';
      document.getElementById('post-image').value = '';
      loadFeed();
    } catch (err) { EduAPI.toast(err.message, 'error'); }
  }
  async function likePost(id) { await EduAPI.request(`/api/posts/${id}/like`, { method: 'POST' }); loadFeed(); }
  async function commentPost(id, input) {
    const content = input.value.trim(); if (!content) return;
    await EduAPI.request(`/api/posts/${id}/comments`, { method: 'POST', body: { content } });
    input.value = ''; loadFeed();
  }
  async function deletePost(id) { if (!confirm('Xoá bài viết này?')) return; await EduAPI.request(`/api/posts/${id}`, { method: 'DELETE' }); loadFeed(); }

  async function loadPeople() {
    const { users } = await EduAPI.request('/api/users/directory');
    const me = EduAPI.getUser();
    people = users.filter(u => u.id !== me.id);
    document.getElementById('people-list').innerHTML = people.map(u => `
      <button onclick='openChat(${JSON.stringify(u)})' class="w-full flex items-center gap-2 p-2 rounded-xl hover:bg-white/5 text-left">
        ${avatarHtml(u, 8)}<span class="text-xs font-bold truncate">${u.fullName || u.username}</span>
      </button>`).join('') || '<p class="text-xs text-slate-500">Không có ai khác.</p>';
  }

  function toggleChat() {
    const panel = document.getElementById('chat-panel');
    panel.classList.toggle('hidden'); panel.classList.toggle('flex');
  }

  function connectChat() {
    ws = EduAPI.openChatSocket(msg => {
      if (msg.type === 'chat' && activePartner && (msg.message.fromId === activePartner.id || msg.message.toId === activePartner.id)) {
        appendChatMsg(msg.message);
      }
    });
  }

  async function openChat(partner) {
    activePartner = partner;
    document.getElementById('chat-title').textContent = partner.fullName || partner.username;
    const panel = document.getElementById('chat-panel');
    panel.classList.remove('hidden'); panel.classList.add('flex');
    const { messages } = await EduAPI.request(`/api/messages/${partner.id}`);
    document.getElementById('chat-messages').innerHTML = '';
    messages.forEach(appendChatMsg);
  }

  function appendChatMsg(m) {
    const me = EduAPI.getUser();
    const box = document.getElementById('chat-messages');
    const mine = m.fromId === me.id;
    box.innerHTML += `<div class="flex ${mine ? 'justify-end' : 'justify-start'}"><span class="px-3 py-2 rounded-2xl ${mine ? 'bg-cyan-500/20 text-cyan-100' : 'bg-white/10 text-slate-200'} max-w-[75%] break-words">${escapeHtml(m.content)}</span></div>`;
    box.scrollTop = box.scrollHeight;
  }

  function sendChat() {
    const input = document.getElementById('chat-input');
    const content = input.value.trim();
    if (!content || !activePartner) return;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'chat', toId: activePartner.id, content }));
    } else {
      EduAPI.request('/api/messages', { method: 'POST', body: { toId: activePartner.id, content } }).then(r => appendChatMsg(r.message));
    }
    input.value = '';
  }
  document.addEventListener('keydown', e => { if (e.target.id === 'chat-input' && e.key === 'Enter') sendChat(); });
</script>
</body>
</html>
